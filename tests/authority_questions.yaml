# PERA Authority-level test question bank.
# 600+ questions across 24 sections covering performance, comparison,
# force requisition, e-challan, admin fines, price control, FIR,
# court cases, ES operationalization, HR, police strength, logistics,
# ADP, legal mandate, DERB, recruitment, training academy, digital
# systems, discipline, finance, data quality, problem-questions,
# final-test set.
#
# Schema per item:
#   q     : question text (verbatim, end-user wording)
#   tags  : list of tags  — kind:numeric|narrative|comparison|reasoning
#                            data:db|doc|hybrid|unknown
#                            risk:high|medium|low (board-meeting impact)
# Section header rows have only `section` + `title`.
---
